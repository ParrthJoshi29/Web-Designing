<html>
    <head>
        <title> text formating</title>
    </head>
    <body>
       <b> hello world</b><br/> <!-- bold tag -->
       <i> hello world</i><br/> <!-- italic tag -->
       <u> hello world</u><br/> <!-- underline tag -->
       <em> hello world</em><br/> <!-- emphasis/italic text tag -->
       <strong> hello world</strong><br/> <!-- strong/bold text tag -->
       h<sub>2</sub>0<br/> <!-- subscript/down tag -->
       10<sup>th</sup> <!-- superscript/up tag -->
    </body>
</html>
